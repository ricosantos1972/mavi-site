<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas listas · MAVI Streaming+</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="max-width:760px">
  <header class="top">
    <a href="./"><img src="img/logo.png" alt="MAVI Streaming+"></a>
    <nav><a href="listas.html" class="on">Minhas listas</a><a href="privacidade.html">Privacidade</a></nav>
  </header>

  <!-- Entrar com o aparelho -->
  <div id="loginBox" class="panel">
    <h2 style="margin-top:0">Minhas listas</h2>
    <p style="color:var(--dim);margin-top:0">Informe o <b>MAC</b> e a <b>Device Key</b> que aparecem no app, em <b>Configurações</b>.</p>
    <form id="loginForm">
      <label for="mac">MAC</label>
      <input id="mac" placeholder="Ex.: 02:1A:2B:3C:4D:5E" autocomplete="off" required>
      <label for="key">Device Key</label>
      <input id="key" placeholder="6 números" inputmode="numeric" maxlength="6" autocomplete="off" required>
      <div style="margin-top:18px"><button class="btn" type="submit">Entrar</button></div>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>

  <!-- Aparelho -->
  <div id="deviceBox" class="hidden">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="status"><span id="stDot" class="dot"></span><span id="stText"></span></div>
        <button class="btn ghost small" id="btnOut">Sair</button>
      </div>
      <p style="color:var(--dim);margin:8px 0 0;font-size:14px">Aparelho <span id="devMac"></span></p>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <h2 style="margin:0">Listas</h2>
        <button class="btn small" id="btnNew">+ Adicionar lista</button>
      </div>
      <div id="lists" style="margin-top:8px"></div>
      <p id="noLists" class="hidden" style="color:var(--dim)">Nenhuma lista ainda. Toque em “Adicionar lista”.</p>
      <p style="color:var(--dim);font-size:13px;margin-bottom:0">As mudanças aparecem no app na próxima vez que ele for aberto.</p>
    </div>
  </div>
</div>

<dialog id="dlg">
  <form id="listForm">
    <h2 style="margin-top:0" id="dlgTitle">Adicionar lista</h2>
    <label for="lName">Nome da lista</label>
    <input id="lName" placeholder="Ex.: Minha lista">
    <label for="lM3u">Link M3U (opcional)</label>
    <input id="lM3u" placeholder="http://servidor:porta/get.php?username=...&password=...">
    <p style="color:var(--dim);font-size:13px;margin:6px 0 0">Ou preencha os dados abaixo:</p>
    <label for="lServer">Servidor</label>
    <input id="lServer" placeholder="http://servidor.com:8080">
    <div class="row">
      <div><label for="lUser">Usuário</label><input id="lUser" autocomplete="off"></div>
      <div><label for="lPass">Senha</label><input id="lPass" autocomplete="off"></div>
    </div>
    <div class="msg err" id="dlgMsg"></div>
    <div class="btns" style="margin-top:8px">
      <button class="btn" type="submit">Salvar</button>
      <button class="btn ghost" type="button" id="dlgCancel">Cancelar</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
let dev = null;     // { mac, key }
let editId = null;

function load() { try { return JSON.parse(localStorage.getItem('mavi_dev') || 'null'); } catch (_) { return null; } }
function save(d) { try { d ? localStorage.setItem('mavi_dev', JSON.stringify(d)) : localStorage.removeItem('mavi_dev'); } catch (_) {} }

function render(st) {
  $('loginBox').classList.add('hidden');
  $('deviceBox').classList.remove('hidden');
  $('stText').textContent = statusText(st);
  $('stDot').className = 'dot ' + dotClass(st.status);
  $('devMac').textContent = dev.mac;
  const box = $('lists');
  box.innerHTML = '';
  $('noLists').classList.toggle('hidden', st.lists.length > 0);
  st.lists.forEach(l => {
    let host = l.server; try { host = new URL(l.server).host; } catch (_) {}
    const el = document.createElement('div');
    el.className = 'list-item';
    el.innerHTML = `<div><b>${esc(l.name)}</b><small>${esc(host)} · usuário ${esc(l.user)}</small></div>
      <div class="btns"><button class="btn ghost small" data-edit>Editar</button><button class="btn ghost small" data-del>Remover</button></div>`;
    el.querySelector('[data-edit]').onclick = () => openDlg(l);
    el.querySelector('[data-del]').onclick = async () => {
      if (!confirm(`Remover a lista "${l.name}"?`)) return;
      try { render(await rpc('mavi_list_delete', { p_mac: dev.mac, p_key: dev.key, p_id: l.id })); }
      catch (e) { alert(e.message); }
    };
    box.appendChild(el);
  });
}

async function enter(d) {
  dev = d;
  const st = await rpc('mavi_status', { p_mac: d.mac, p_key: d.key });
  save(d);
  render(st);
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginMsg').className = 'msg'; $('loginMsg').textContent = 'Entrando...';
  try { await enter({ mac: normMac($('mac').value), key: $('key').value.trim() }); $('loginMsg').textContent = ''; }
  catch (err) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = err.message; }
};

$('btnOut').onclick = () => { save(null); dev = null; location.reload(); };

function openDlg(l) {
  editId = l ? l.id : null;
  $('dlgTitle').textContent = l ? 'Editar lista' : 'Adicionar lista';
  $('lName').value = l ? l.name : '';
  $('lM3u').value = '';
  $('lServer').value = l ? l.server : '';
  $('lUser').value = l ? l.user : '';
  $('lPass').value = l ? l.pass : '';
  $('dlgMsg').textContent = '';
  $('dlg').showModal();
}
$('btnNew').onclick = () => openDlg(null);
$('dlgCancel').onclick = () => $('dlg').close();

$('listForm').onsubmit = async e => {
  e.preventDefault();
  let server = $('lServer').value.trim(), user = $('lUser').value.trim(), pass = $('lPass').value.trim();
  const m3u = $('lM3u').value.trim();
  if (m3u) {
    const p = parseM3u(m3u);
    if (!p) { $('dlgMsg').textContent = 'Link não reconhecido. Use o link com usuário e senha (get.php?username=...&password=...).'; return; }
    ({ server, user, pass } = p);
  }
  if (server && !/^https?:\/\//i.test(server)) server = 'http://' + server;
  server = server.replace(/\/+$/, '');
  if (!server || !user || !pass) { $('dlgMsg').textContent = 'Preencha servidor, usuário e senha, ou cole o link M3U.'; return; }
  let name = $('lName').value.trim();
  if (!name) { try { name = new URL(server).hostname; } catch (_) { name = 'Minha lista'; } }
  try {
    render(await rpc('mavi_list_save', {
      p_mac: dev.mac, p_key: dev.key, p_id: editId || crypto.randomUUID(),
      p_name: name, p_server: server, p_user: user, p_pass: pass,
    }));
    $('dlg').close();
  } catch (err) { $('dlgMsg').textContent = err.message; }
};

// Volta direto se já entrou antes neste navegador; aceita ?mac=...&key=... no link
(async () => {
  const q = new URLSearchParams(location.search);
  const d = q.get('mac') && q.get('key') ? { mac: normMac(q.get('mac')), key: q.get('key') } : load();
  if (!d) return;
  $('mac').value = d.mac; $('key').value = d.key;
  try { await enter(d); } catch (_) { save(null); }
})();
</script>
</body>
</html>
